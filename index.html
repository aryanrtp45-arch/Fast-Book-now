<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="f0b44c1f1865e562" />
    
    <!-- Highly Optimized SEO Tags for "Fast Book now" -->
    <title>Fast Book now - Aryan's Epic Interactive Birthday</title>
    <meta name="description" content="Fast Book now to experience the most magical interactive birthday celebration for Aryan. Cut the cake, light the fireworks, and enjoy the party!" />
    <meta name="keywords" content="Fast Book now, Book now fast, Aryan Happy Birthday, Interactive Cake Cutting, Virtual Fireworks" />
    <meta name="author" content="Aryan's Best Wisher" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media SEO -->
    <meta property="og:title" content="Fast Book now - Aryan's Epic Birthday" />
    <meta property="og:description" content="Tap to cut the cake and trigger massive fireworks! A magical birthday wish." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti for Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050510;
            overflow: hidden; /* Hide scrollbars for full screen effect */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Nunito', sans-serif;
            cursor: crosshair; /* Cool cursor */
        }

        /* Touch/Mouse Trail Canvas */
        #trailCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Let clicks pass through to the cake */
        }

        /* UI Container */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The Cake Container */
        .cake-container {
            position: relative;
            width: 200px;
            height: 180px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cake-container:hover {
            transform: scale(1.05);
        }

        /* Cake Halves (For Cutting Effect) */
        .cake-half {
            position: absolute;
            bottom: 0;
            width: 100px;
            height: 120px;
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 50%, #fbc2eb 100%);
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .cake-half.left {
            left: 0;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 10px;
            border-right: 2px dashed #ff6b81; /* Cut line */
        }

        .cake-half.right {
            right: 0;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 10px;
            border-left: 2px dashed #ff6b81;
        }

        /* Icing */
        .icing {
            position: absolute;
            top: 0;
            width: 100%;
            height: 40px;
            background: #fff;
            border-radius: 20px 20px 0 0;
        }

        /* Candle */
        .candle {
            position: absolute;
            top: -40px;
            left: 45px;
            width: 10px;
            height: 40px;
            background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff4757 5px, #ff4757 10px);
            transition: opacity 0.5s ease;
        }

        /* Flame */
        .flame {
            position: absolute;
            top: -20px;
            left: -5px;
            width: 20px;
            height: 20px;
            background: #ffa502;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 20px #ffa502, 0 0 40px #ff4757;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
        }

        /* Instruction Text */
        .instruction {
            color: #00ffcc;
            font-size: 1.5rem;
            margin-top: 40px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1s infinite alternate;
            text-shadow: 0 0 10px #00ffcc;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Hidden Birthday Message */
        .birthday-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Fredoka One', cursive;
            font-size: 5rem;
            text-align: center;
            width: 100vw;
            color: #fff;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ffcc00, 0 0 60px #00ffcc;
            z-index: 20;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Action: When Cake is Cut */
        .cut .cake-half.left { transform: translateX(-150px) rotate(-20deg); opacity: 0; }
        .cut .cake-half.right { transform: translateX(150px) rotate(20deg); opacity: 0; }
        .cut .candle { opacity: 0; }

        @media (max-width: 768px) {
            .birthday-text { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <!-- Canvas for Touch/Mouse Trail Particles -->
    <canvas id="trailCanvas"></canvas>

    <div class="ui-layer">
        <!-- The Interactive Cake -->
        <div class="cake-container" id="birthdayCake" onclick="cutCake()">
            <div class="cake-half left">
                <div class="icing"></div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
            <div class="cake-half right">
                <div class="icing"></div>
            </div>
        </div>

        <div class="instruction" id="instructText">👆 TAP TO CUT THE CAKE! 🔪</div>
    </div>

    <!-- Final Blast Message -->
    <div class="birthday-text" id="bdayMessage">
        HAPPY<br>Opening <br><span style="color: #ffcc00;">Zoom printing & Flex Banner</span> 🎇
    </div>

    <script>
        /* -----------------------------------------
           1. TOUCH & MOUSE TRAIL EFFECT (Mast Effect)
           ----------------------------------------- */
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 2; // Particle size
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                // Random vibrant colors
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.1; // Shrink over time
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles(e) {
            let xPos = e.x || (e.touches && e.touches[0].clientX);
            let yPos = e.y || (e.touches && e.touches[0].clientY);
            
            for (let i = 0; i < 5; i++) {
                particlesArray.push(new Particle(xPos, yPos));
            }
        }

        // Listen for both mouse and touch movements
        window.addEventListener('mousemove', createParticles);
        window.addEventListener('touchmove', createParticles);

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                // Remove tiny particles
                if (particlesArray[i].size <= 0.2) {
                    particlesArray.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Resize canvas on window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        /* -----------------------------------------
           2. CAKE CUTTING & FIREWORKS (Patake)
           ----------------------------------------- */
        let cakeCut = false;

        function cutCake() {
            if (cakeCut) return; // Prevent multiple clicks
            cakeCut = true;

            const cake = document.getElementById('birthdayCake');
            const instruct = document.getElementById('instructText');
            const message = document.getElementById('bdayMessage');

            // 1. Cut the cake (adds CSS class to split it)
            cake.classList.add('cut');
            instruct.style.display = 'none'; // Hide instructions

            // 2. Play Fireworks & Show Text after a tiny delay
            setTimeout(() => {
                message.style.display = 'block'; // Show Happy Birthday
                launchFireworks(); // Start Patake!
            }, 400);
        }

        // Function for Massive Fireworks
        function launchFireworks() {
            const duration = 15 * 1000; // Patake 15 seconds tak chalenge
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                
                // Fire from multiple random locations to simulate real Patake
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 } 
                }));
                
                // Occasional huge blasts
                if (Math.random() > 0.7) {
                    confetti({
                        particleCount: 150,
                        spread: 100,
                        origin: { y: 0.6 }
                    });
                }
            }, 250);
        }
    </script>
</body>
</html>
